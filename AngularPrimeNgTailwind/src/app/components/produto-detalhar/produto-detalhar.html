<div class="glass-card p-8">
  <div class="flex items-start justify-between gap-4 mb-8">
    <div>
      <h3 class="text-xl font-bold text-slate-800">Detalhes do Produto</h3>
      <p class="text-slate-500 mt-1">Informações completas do item selecionado</p>
    </div>

    <p-button
      icon="pi pi-times"
      severity="secondary"
      rounded
      text
      (onClick)="fechar.emit()">
    </p-button>
  </div>

  <div class="grid md:grid-cols-3 gap-8">
    <div class="detail-box">
      <span>Nome</span>
      <strong>{{ produto().nome }}</strong>
    </div>

    <div class="detail-box">
      <span>Preço</span>
      <strong>R$ {{ produto().preco.toFixed(2) }}</strong>
    </div>

    <div class="detail-box">
      <span>Status</span>
      <strong>{{ produto().ativo ? 'Ativo' : 'Inativo' }}</strong>
    </div>
  </div>
</div>
