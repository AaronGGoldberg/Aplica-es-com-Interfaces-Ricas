<div class="glass-card overflow-hidden">
  <div class="px-8 py-8 border-b border-slate-200 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Produtos cadastrados</h2>
      <p class="text-slate-500 mt-1">{{ produtoService.listar().length }} registro(s)</p>
    </div>

    <p-button
      label="Novo produto"
      icon="pi pi-plus"
      routerLink="/produtos/novo">
    </p-button>
  </div>

  <p-table
    [value]="produtoService.listar()"
    [stripedRows]="true">

    <ng-template pTemplate="header">
      <tr>
        <th>Produto</th>
        <th class="text-right">Preço</th>
        <th class="text-center">Status</th>
        <th class="text-center">Ações</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-p>
      <tr>
        <td>
          <div class="font-semibold text-slate-800">{{ p.nome }}</div>
          <div class="text-xs text-slate-400">ID: {{ p.id }}</div>
        </td>

        <td class="text-right font-semibold text-slate-700">
          R$ {{ p.preco.toFixed(2) }}
        </td>

        <td class="text-center">
          <span
            class="status-pill"
            [ngClass]="p.ativo ? 'bg-green-100 text-green-700' : 'bg-slate-200 text-slate-600'">
            {{ p.ativo ? 'Ativo' : 'Inativo' }}
          </span>
        </td>

        <td>
          <div class="flex justify-center gap-2">
            <p-button
              icon="pi pi-pencil"
              severity="secondary"
              rounded
              text
              (onClick)="editar(p)">
            </p-button>

            <app-produto-remover [produto]="p"></app-produto-remover>

            <p-button
              icon="pi pi-eye"
              severity="info"
              rounded
              text
              (onClick)="detalhar(p)">
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td
          colspan="4"
          class="text-center py-16 text-slate-400">
          Nenhum produto cadastrado
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
