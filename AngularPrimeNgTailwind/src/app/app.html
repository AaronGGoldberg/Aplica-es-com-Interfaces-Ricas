<p-toast></p-toast>

<div class="min-h-screen bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100">
  <header class="backdrop-blur-xl bg-white/70 border-b border-white/40 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-8 py-6 flex justify-between items-center">
      <div class="flex items-center gap-5">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center shadow-xl">
          <i class="pi pi-shopping-bag text-white text-xl"></i>
        </div>
        <div>
          <h1 class="text-3xl font-bold text-slate-800">Sistema de Produtos</h1>
          <p class="text-slate-500 mt-1">Gerenciamento Automatizado</p>
        </div>
  </div>

  <div class="bg-white shadow-lg rounded-full px-5 py-2 text-sm text-slate-700 border border-slate-200">
    Angular + PrimeNG
  </div>
</div>

  </header>

  <div class="max-w-7xl mx-auto px-8 py-10 space-y-8">
    <div class="grid md:grid-cols-3 gap-6">
      <div class="dashboard-card">
        <div class="flex justify-between">
          <div>
            <p class="text-slate-500 text-sm">Produtos</p>
            <h2 class="text-3xl font-bold text-slate-800 mt-2">{{ totalProdutos() }}</h2>
          </div>
          <i class="pi pi-box text-blue-600 text-2xl"></i>
        </div>
      </div>

      <div class="dashboard-card">
        <div class="flex justify-between">
          <div>
            <p class="text-slate-500 text-sm">Ativos</p>
        <h2 class="text-3xl font-bold text-green-600 mt-2">{{ totalAtivos() }}</h2>
      </div>
      <i class="pi pi-check-circle text-green-600 text-2xl"></i>
    </div>
  </div>

  <div class="dashboard-card">
    <div class="flex justify-between">
      <div>
        <p class="text-slate-500 text-sm">Valor total</p>
        <h2 class="text-2xl font-bold text-indigo-600 mt-2">R$ {{ valorTotal() }}</h2>
      </div>
      <i class="pi pi-wallet text-indigo-600 text-2xl"></i>
    </div>
  </div>
</div>

@if (produtoEditando(); as produto) {
  <app-produto-alterar
    [produto]="produto"
    (produtoAtualizado)="alterar($event)"
    (edicaoCancelada)="cancelarEdicao()">
  </app-produto-alterar>
} @else {
  <app-produto-incluir
    (produtoCriado)="incluir($event)">
  </app-produto-incluir>
}

<app-produto-listar
  [produtos]="produtos()"
  (editar)="selecionarParaEdicao($event)"
  (remover)="remover($event)"
  (detalhar)="detalhar($event)">
</app-produto-listar>

@if (produtoSelecionado(); as produto) {
  <app-produto-detalhar
    [produto]="produto"
    (fechar)="fecharDetalhes()">
  </app-produto-detalhar>
}

  </div>

  <footer class="py-8 text-center text-slate-500">
    Sistema acadêmico • PrimeNG UI
  </footer>
</div>
