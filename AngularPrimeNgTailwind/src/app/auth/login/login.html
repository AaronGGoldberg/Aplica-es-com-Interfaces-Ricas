<div class="min-h-[calc(100vh-3rem)] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-5xl grid lg:grid-cols-[1.1fr_.9fr] rounded-[2rem] overflow-hidden shadow-2xl bg-white/90 backdrop-blur-xl border border-white/60">
    <section class="hidden lg:flex flex-col justify-between p-12 bg-gradient-to-br from-indigo-700 via-blue-700 to-cyan-600 text-white">
      <div>
        <div class="w-16 h-16 rounded-3xl bg-white/20 flex items-center justify-center shadow-xl mb-8">
          <i class="pi pi-shield text-3xl"></i>
        </div>

        <h1 class="text-4xl font-black leading-tight">Acesso seguro ao Sistema de Produtos</h1>
        <p class="mt-5 text-blue-100 text-lg leading-relaxed">
          Faça login para gerenciar produtos, consultar detalhes, cadastrar novos itens e manter o catálogo atualizado.
        </p>
      </div>

      <div class="grid grid-cols-3 gap-3 text-sm">
        <div class="rounded-2xl bg-white/15 p-4">
          <i class="pi pi-lock block text-xl mb-2"></i>
          JWT
        </div>
        <div class="rounded-2xl bg-white/15 p-4">
          <i class="pi pi-route block text-xl mb-2"></i>
          Guardas
        </div>
        <div class="rounded-2xl bg-white/15 p-4">
          <i class="pi pi-send block text-xl mb-2"></i>
          Interceptor
        </div>
      </div>
    </section>

    <section class="p-8 sm:p-12">
      <div class="mb-10 text-center lg:text-left">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-100 text-indigo-700 mb-5">
          <i class="pi pi-user text-2xl"></i>
        </div>
        <h2 class="text-3xl font-black text-slate-800">Entrar</h2>
        <p class="text-slate-500 mt-2">Use suas credenciais para continuar.</p>
      </div>

      <form class="space-y-6" (submit)="$event.preventDefault(); entrar()">
        <div>
          <label class="label-style">Usuário</label>
          <input
            pInputText
            class="custom-input"
            autocomplete="username"
            [ngModel]="username()"
            (ngModelChange)="username.set($event)"
            name="username"
            placeholder="admin">
        </div>

        <div>
          <label class="label-style">Senha</label>
          <p-password
            styleClass="w-full"
            inputStyleClass="custom-input"
            autocomplete="current-password"
            [feedback]="false"
            [toggleMask]="true"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            placeholder="admin123">
          </p-password>
        </div>

        <p-button
          styleClass="w-full justify-center"
          label="Acessar sistema"
          icon="pi pi-sign-in"
          size="large"
          [raised]="true"
          [loading]="carregando()"
          type="submit">
        </p-button>
      </form>

      <div class="mt-8 rounded-2xl bg-slate-100 border border-slate-200 p-4 text-sm text-slate-600">
        <strong>Usuário de teste:</strong> admin<br>
        <strong>Senha:</strong> admin123
      </div>
    </section>
  </div>
</div>
